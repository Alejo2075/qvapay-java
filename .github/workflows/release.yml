name: Release (manual)

# Runs ONLY when a maintainer starts it by hand, and the job waits for approval of the protected
# environment "maven-central". It never runs on push, pull_request or tags, and never on forks.
# It uploads a signed bundle to the Central Portal for VALIDATION; with autoPublish=false the
# deployment is NOT released until someone publishes it in https://central.sonatype.com/publishing/deployments.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, exactly as in the POM (no -SNAPSHOT), e.g. 0.1.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Sign and upload ${{ inputs.version }} to the Central Portal
    runs-on: ubuntu-latest
    environment: maven-central
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          # Writes a temporary settings.xml that reads the token from the environment (never stored).
          server-id: central
          server-username: CENTRAL_TOKEN_USERNAME
          server-password: CENTRAL_TOKEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: Check version, tag and release notes
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          pom_version="$(./mvnw -B -ntp -q help:evaluate -Dexpression=project.version -DforceStdout)"
          if [ "$pom_version" != "$VERSION" ]; then
            echo "::error::POM version ($pom_version) differs from the requested version ($VERSION)"; exit 1
          fi
          case "$VERSION" in *SNAPSHOT*) echo "::error::SNAPSHOT versions cannot be released"; exit 1;; esac
          if ! git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            echo "::error::Create the annotated tag v${VERSION} on the commit to release first"; exit 1
          fi
          if [ "$(git rev-parse "v${VERSION}^{commit}")" != "$(git rev-parse HEAD)" ]; then
            echo "::error::Tag v${VERSION} does not point to the commit being released"; exit 1
          fi
          if ! grep -q "^## \[${VERSION}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for ${VERSION}"; exit 1
          fi

      - name: Full verification (format, tests, coverage, javadoc)
        run: ./mvnw -B -ntp clean verify

      - name: Example consumers against the release candidate
        run: |
          ./mvnw -B -ntp install -DskipTests
          ./mvnw -B -ntp -f examples/plain-java/pom.xml -Dqvapay.version="$VERSION" clean verify
        env:
          VERSION: ${{ inputs.version }}

      - name: Sign and upload to the Central Portal (validation only)
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -o pipefail
          ./mvnw -B -ntp -Pcentral -DskipTests clean deploy | tee deploy.log

      - name: Summary
        env:
          VERSION: ${{ inputs.version }}
        run: |
          {
            echo "### ${VERSION} uploaded to the Central Portal for validation"
            echo
            echo "**Not published yet.** Review and publish it manually at https://central.sonatype.com/publishing/deployments."
            echo "Do not announce the release until the coordinates resolve from Maven Central."
            echo
            grep -iE "deployment|Central" deploy.log | grep -viE "token|password|secret" | tail -5 | sed 's/^/    /' || true
          } >> "$GITHUB_STEP_SUMMARY"
