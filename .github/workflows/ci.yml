name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      # Offline against QvaPay: no QvaPay credentials, GPG keys or tokens exist in this workflow.
      # Format check, tests, JaCoCo thresholds, Javadoc, sources jar and enforcer all run in verify.
      - name: Verify
        run: ./mvnw -B -ntp clean verify

  build-jdk25:
    name: Compatibility (JDK 25, optional)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # google-java-format 1.27 (the last release that runs on JDK 17) cannot run on JVM 25.
      # Formatting is already enforced by the JDK 17 and 21 jobs; this job checks behaviour.
      - name: Verify
        run: ./mvnw -B -ntp -Dspotless.check.skip=true clean verify

  examples:
    name: Example consumers (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v4
      # JDK 17 is always installed: the Gradle examples use a Java 17 toolchain.
      # The last entry becomes the default JAVA_HOME.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            ${{ matrix.java }}
          cache: maven
      # Consumers use the jar installed in ~/.m2, exactly like an external project would.
      - name: Install the SDK locally
        run: ./mvnw -B -ntp install -DskipTests
      - name: Maven examples
        run: |
          ./mvnw -B -ntp -f examples/plain-java/pom.xml clean verify
          ./mvnw -B -ntp -f examples/webhook/pom.xml clean verify
      - name: Gradle examples
        run: |
          for dir in examples/gradle-java examples/gradle-groovy; do
            (cd "$dir" && ./gradlew --no-daemon test -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64)
          done

  readme-snippets:
    name: README snippets match the compiled examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/readme_snippets.py check

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: never
