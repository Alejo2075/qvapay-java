name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Never paste real credentials, tokens or customer data.** Security problems: see SECURITY.md instead of opening an issue.
  - type: input
    id: version
    attributes:
      label: SDK version
    validations:
      required: true
  - type: input
    id: java
    attributes:
      label: Java version and vendor
      placeholder: "17.0.x Temurin"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal sanitized example
      render: java
  - type: textarea
    id: response
    attributes:
      label: Sanitized API response or exception (status and code only)
